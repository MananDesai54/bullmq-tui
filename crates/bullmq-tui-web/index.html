<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BullMQ Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
        }

        #terminal {
            width: 100%;
            height: 100%;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.2;
        }

        /* Ratzilla styles will be applied dynamically */
        .ratzilla-container {
            width: 100%;
            height: 100%;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c7a89;
            font-family: monospace;
            font-size: 16px;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div id="terminal" class="ratzilla-container">
        <div class="loading">Loading BullMQ Monitor</div>
    </div>

    <script type="module">
        import init from './pkg/bullmq_tui_web.js';

        async function run() {
            try {
                await init();
                console.log('BullMQ TUI initialized');
            } catch (e) {
                console.error('Failed to initialize BullMQ TUI:', e);
                document.getElementById('terminal').innerHTML = `
                    <div class="loading" style="color: #e74c3c;">
                        Failed to load: ${e.message}
                    </div>
                `;
            }
        }

        run();
    </script>
</body>
</html>
